services:
  triptrek:
    build: .
    container_name: triptrek
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/db
      - app-uploads:/app/public/uploads
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data:
  app-uploads:
