# TripTrek — Production Docker Compose
# cd docker-deploy && docker compose up -d --build
# Секреты — в .env (см. .env.example): NEXTAUTH_SECRET, POSTGRES_PASSWORD,
# DOMAIN/ACME_EMAIL (Caddy TLS), VAPID_*, WS_ALLOWED_ORIGINS, OPENAI_*.

services:
  db:
    image: postgres:16-alpine
    container_name: triptrek-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=triptrek
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=triptrek
    volumes:
      - triptrek-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triptrek -d triptrek"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: docker-deploy/Dockerfile
    container_name: triptrek-app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://triptrek:${POSTGRES_PASSWORD}@db:5432/triptrek?schema=public&connection_limit=10
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-*}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - triptrek-uploads:/app/public/uploads
    # host.docker.internal -> хост: там слушает postfix :25 (письма сброса пароля)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    # default — своя сеть (db); caddy-shared — сеть ОБЩЕГО Caddy (guild-ledger),
    # который резолвит triptrek-app по имени контейнера. Без неё сайт падает в
    # 502 при каждом пересоздании контейнера (инцидент 2026-09-16: ручной
    # `docker network connect` слетел при redeploy).
    networks:
      - default
      - caddy-shared
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: triptrek-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - triptrek-caddy-data:/data
      - triptrek-caddy-config:/config
    depends_on:
      - app

volumes:
  triptrek-pgdata:
  triptrek-uploads:
  triptrek-caddy-data:
  triptrek-caddy-config:

networks:
  caddy-shared:
    name: supabase-network
    external: true
