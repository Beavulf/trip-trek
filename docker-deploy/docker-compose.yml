# TripTrek — Production Docker Compose
# cd docker-deploy && docker compose up -d --build
# Секреты (POSTGRES_PASSWORD, NEXTAUTH_SECRET, VAPID_*, OPENAI_*) — в .env рядом

services:
  db:
    image: postgres:16-alpine
    container_name: triptrek-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=triptrek
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=triptrek
    volumes:
      - triptrek-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triptrek -d triptrek"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: docker-deploy/Dockerfile
    container_name: triptrek-app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://triptrek:${POSTGRES_PASSWORD}@db:5432/triptrek?schema=public&connection_limit=10
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-*}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - triptrek-uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  triptrek-pgdata:
  triptrek-uploads:
